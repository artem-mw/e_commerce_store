name: Build and Deploy Backend to Cloud Run

on:
  push:
    branches: ["main"]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.CR_REGION }}
  REPOSITORY: backend-repo
  SERVICE_NAME: e-commerce-backend
  IMAGE_NAME: e-commerce-backend

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: "auth"
        name: Authenticate to Google Cloud
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Configure Docker for GCP Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          docker build -t $IMAGE_URI ./backend
          docker push $IMAGE_URI

      - name: Deploy to Cloud Run
        uses: "google-github-actions/deploy-cloudrun@v3"
        with:
          service: "${{ env.SERVICE_NAME }}"
          region: "${{ env.REGION }}"
          image: "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
          env_vars: ${{ secrets.PROD_BACKEND_ENV }}